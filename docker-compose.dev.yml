# Local databases for development and integration tests.
# Both engines run: production (Hostinger) is MariaDB 11.8; MySQL 8 stays supported for other hosts.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: challengeforge
    ports: ["127.0.0.1:33061:3306"]
    tmpfs: ["/var/lib/mysql"]
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: devroot
      MARIADB_DATABASE: challengeforge
    ports: ["127.0.0.1:33062:3306"]
    tmpfs: ["/var/lib/mysql"]
